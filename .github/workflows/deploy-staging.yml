name: Deploy staging

# Push lên main = build image mới (nginx + dist/ đã bake) + đẩy sang máy staging.
# Build chạy trên GitHub-hosted runner. Máy staging chỉ `pull` image đã build
# sẵn rồi recreate container — mirror ../infun/.github/workflows/deploy-staging.yml,
# nhưng chỉ 1 service tĩnh (không PHP/DB/migrate).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_WEB: ghcr.io/phantien304/infuncms-web
  # Vite BAKE các biến VITE_* vào bundle lúc build (không đọc lại lúc container
  # chạy) — xem comment đầu Dockerfile.staging. Đổi giá trị ở đây nếu backend
  # staging đổi domain, KHÔNG sửa trong docker-compose.staging.yml (chỉ dùng
  # cho build tay tại chỗ).
  #
  # KHÔNG dùng infun.co ở đây — nó LÀ domain thật (public, trỏ production),
  # chỉ "tưởng" là local vì máy dev có dòng override trong hosts
  # (127.0.0.1 infun.co). Máy nào không có dòng override đó (bất kỳ ai khác mở
  # CMS staging) sẽ gọi thẳng ra domain production thật thay vì backend
  # staging. Dùng Tailscale IP của máy staging (100.99.170.2, cổng 8100 =
  # infun-web-staging) — vào được từ mọi máy trong tailnet, không cần domain/
  # hosts override nào cả. Nhớ: infun/docker-compose.staging.yml phải khai
  # CORS_ALLOWED_ORIGINS cho đúng origin CMS staging (đã thêm, xem comment ở đó).
  STAGING_VITE_API_BASE_URL: http://100.99.170.2:8100/rcms
  STAGING_VITE_LARAVEL_ORIGIN: http://100.99.170.2:8100

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push infuncms-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.staging
          target: web
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ env.STAGING_VITE_API_BASE_URL }}
            VITE_LARAVEL_ORIGIN=${{ env.STAGING_VITE_LARAVEL_ORIGIN }}
          # :staging = tag di động (luôn trỏ bản mới nhất). :sha-XXX = tag BẤT
          # BIẾN để production promote đúng artifact đã test — LƯU Ý: khác
          # backend infun, production của infuncms REBUILD chứ không retag
          # (Vite bake build-arg khác cho domain khác), xem comment đầu
          # Dockerfile.staging.
          tags: |
            ${{ env.IMAGE_WEB }}:staging
            ${{ env.IMAGE_WEB }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 100.99.170.2 >> ~/.ssh/known_hosts

      # Máy staging (Ubuntu) — repo mirror ở /home/an-my/infuncms. Thư mục
      # phải được `git clone` sẵn 1 lần thủ công trước khi workflow này chạy
      # lần đầu (xem README/CLAUDE.md phần deploy).
      - name: Pull image + recreate container on staging
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i ~/.ssh/id_ed25519 an-my@100.99.170.2 "
            set -e
            cd /home/an-my/infuncms
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            docker compose -f docker-compose.staging.yml pull infuncms-web
            docker compose -f docker-compose.staging.yml up -d --no-build infuncms-web
            docker image prune -f
          "
