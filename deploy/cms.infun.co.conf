# ==================================================================
# Herd (nginx) — proxy cms.infun.co (cổng 80)  ->  Vite dev server (5173)
# ------------------------------------------------------------------
# Dùng cho `npm run dev` (có HMR / hot reload), URL sạch không kèm :5173.
# cms.infun.co ép về 127.0.0.1 bằng file hosts (xem SETUP-cms.infun.co.md).
#
# Cách dùng (chi tiết trong SETUP-cms.infun.co.md):
#   1) hosts:            127.0.0.1  cms.infun.co
#   2) copy file này ->  %USERPROFILE%\.config\herd\config\valet\Nginx\cms.infun.co.conf
#   3) chạy Vite:        cd E:\xampp82\htdocs\infuncms  &&  npm run dev
#   4) herd restart
#   5) mở http://cms.infun.co
# ==================================================================

server {
    listen 80;
    listen [::]:80;
    server_name cms.infun.co;

    charset utf-8;
    client_max_body_size 128M;

    # Toàn bộ request (kể cả /@vite, /src, /node_modules) đẩy sang Vite.
    location / {
        proxy_pass http://127.0.0.1:5173;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket cho Vite HMR — thiếu 3 dòng này thì trang load được nhưng
        # sửa code KHÔNG tự cập nhật + console báo lỗi websocket.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # HMR giữ kết nối lâu; tắt buffering cho stream mượt.
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        proxy_buffering     off;
    }

    access_log off;
}
