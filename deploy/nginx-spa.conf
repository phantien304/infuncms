# ═══════════════════════════════════════════════════════════════════════════
# nginx phục vụ infuncms (React SPA) đã build tĩnh — dùng trong image
# staging/production (xem ../Dockerfile.staging, stage "web").
#
# Khác hẳn nginx của backend infun (docker/nginx/default.conf|default.lb.conf):
# KHÔNG có PHP-FPM/fastcgi nào cả — toàn bộ file trong /usr/share/nginx/html
# là HTML/JS/CSS tĩnh do `npm run build` sinh ra, KHÔNG mount code, KHÔNG cần
# resolver/upstream (không gọi service Docker nào khác).
#
# `try_files ... /index.html`: SPA dùng react-router (client-side routing) —
# deep-link như /store-review/list KHÔNG phải file thật trên đĩa, phải trả về
# index.html để React Router tự nhận URL và render đúng trang. Thiếu dòng
# này thì F5/mở thẳng link con sẽ ra 404 của nginx thay vì app.
# ═══════════════════════════════════════════════════════════════════════════
#
# BACKEND_PROXY_HOST/PORT (tuỳ chọn — envsubst lúc container start, xem
# Dockerfile.staging + docker-entrypoint): khi set, 2 location /rcms và
# /sanctum bên dưới proxy_pass THẲNG sang backend Laravel thay vì để SPA gọi
# origin tuyệt đối (VITE_API_BASE_URL/VITE_LARAVEL_ORIGIN lúc đó nên để rỗng/
# tương đối — xem docker-compose.staging.yml).
#
# Lý do phải same-origin: Laravel Sanctum SPA dùng cookie httpOnly
# (laravel-session, XSRF-TOKEN) — khi SESSION_DOMAIN không set (mặc định),
# cookie là "host-only" của ĐÚNG hostname trả về Set-Cookie. SPA gọi origin
# TUYỆT ĐỐI khác hostname trang đang mở (vd trang mở bằng localhost:8200,
# gọi thẳng API ở 100.99.170.2:8100) → JS trên trang KHÔNG đọc được cookie
# XSRF-TOKEN của hostname kia (document.cookie chỉ thấy cookie của origin
# hiện tại) → CSRF token mismatch (419) DÙ backend hoàn toàn đúng — sự cố
# 2026-08-10, login CMS staging qua Tailscale IP. Proxy cùng-origin ở đây
# giải quyết tận gốc: browser luôn thấy API cùng host:port với trang, không
# phụ thuộc bạn gõ localhost hay Tailscale IP vào thanh địa chỉ.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 16M;

    # Docker embedded DNS — BẮT BUỘC khi proxy_pass dùng biến ($backend dưới
    # đây): không có resolver, nginx chỉ resolve 1 lần lúc start rồi cache
    # vĩnh viễn — container backend bị recreate (đổi IP) là proxy chết cứng
    # tới khi tự tay reload nginx. Cùng pattern với infun/docker/nginx/default.lb.conf.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Healthcheck cho deploy/prod-deploy.sh + docker-compose healthcheck —
    # cùng quy ước /__lb_health với infun-web (docker/nginx/default.lb.conf).
    location = /__lb_health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # /rcms (REST CMS) + /sanctum (csrf-cookie) → backend Laravel qua network
    # Docker chung với infun (xem docker-compose.staging.yml networks:
    # infun-net external). Container backend cố định tên "infun-web-staging"
    # (infun/docker-compose.staging.yml) nên trỏ thẳng, không cần load balance
    # ở tầng này — infun-web tự route tiếp /rcms vào pool admin của nó.
    location ~ ^/(rcms|sanctum)(/|$) {
        set $backend "${BACKEND_PROXY_HOST}";
        proxy_pass http://$backend:${BACKEND_PROXY_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    # Asset build của Vite có hash trong tên file (vd app.a1b2c3.js) nên cache
    # dài hạn an toàn — đổi code ra tên file mới, không cần purge cache.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        try_files $uri =404;
        access_log off;
    }

    # index.html KHÔNG được cache dài — nó là thứ trỏ tới asset hash mới nhất
    # sau mỗi lần build. Cache nó thì user F5 vẫn dính bundle cũ.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback — mọi route không khớp file tĩnh đều trả index.html,
    # React Router tự route phía client (xem docblock đầu file).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /var/log/nginx/infuncms_access.log;
    error_log  /var/log/nginx/infuncms_error.log;
}
