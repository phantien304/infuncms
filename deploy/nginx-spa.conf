# ═══════════════════════════════════════════════════════════════════════════
# nginx phục vụ infuncms (React SPA) đã build tĩnh — dùng trong image
# staging/production (xem ../Dockerfile.staging, stage "web").
#
# Khác hẳn nginx của backend infun (docker/nginx/default.conf|default.lb.conf):
# KHÔNG có PHP-FPM/fastcgi nào cả — toàn bộ file trong /usr/share/nginx/html
# là HTML/JS/CSS tĩnh do `npm run build` sinh ra, KHÔNG mount code, KHÔNG cần
# resolver/upstream (không gọi service Docker nào khác).
#
# `try_files ... /index.html`: SPA dùng react-router (client-side routing) —
# deep-link như /store-review/list KHÔNG phải file thật trên đĩa, phải trả về
# index.html để React Router tự nhận URL và render đúng trang. Thiếu dòng
# này thì F5/mở thẳng link con sẽ ra 404 của nginx thay vì app.
# ═══════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 16M;

    # Healthcheck cho deploy/prod-deploy.sh + docker-compose healthcheck —
    # cùng quy ước /__lb_health với infun-web (docker/nginx/default.lb.conf).
    location = /__lb_health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Asset build của Vite có hash trong tên file (vd app.a1b2c3.js) nên cache
    # dài hạn an toàn — đổi code ra tên file mới, không cần purge cache.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        try_files $uri =404;
        access_log off;
    }

    # index.html KHÔNG được cache dài — nó là thứ trỏ tới asset hash mới nhất
    # sau mỗi lần build. Cache nó thì user F5 vẫn dính bundle cũ.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback — mọi route không khớp file tĩnh đều trả index.html,
    # React Router tự route phía client (xem docblock đầu file).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /var/log/nginx/infuncms_access.log;
    error_log  /var/log/nginx/infuncms_error.log;
}
